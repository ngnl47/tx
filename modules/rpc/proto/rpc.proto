syntax = "proto3";

package tx.rpc.v1;

option go_package = "github.com/ngnl47/tx/modules/rpc/pb;rpcpb";

// RouteKind 标识消息目标的解析方式。
enum RouteKind {
  ROUTE_KIND_UNSPECIFIED = 0;
  ROUTE_KIND_SERVICE = 1;
  ROUTE_KIND_INSTANCE = 2;
}

// Route 保存传输层路由元数据，Payload 保持不透明。
message Route {
  RouteKind kind = 1;
  string service = 2;
  string instance_id = 3;
}

// Delivery 表示一条定向内部消息，Payload 使用调用方选择的编解码格式。
message Delivery {
  Route route = 1;
  string message_type = 2;
  fixed32 command_hash = 3;
  bytes payload = 4;
}

message Result {
  string message_type = 1;
  fixed32 command_hash = 2;
  bytes payload = 3;
}

message DeliveryAck {
  bool accepted = 1;
  string error_code = 2;
}

// StreamCallRequest 在一条长流中标识一项独立调用。
message StreamCallRequest {
  uint64 id = 1;
  Delivery delivery = 2;
  bool cancel = 3;
  reserved 4;
  // one_way 在服务端按流顺序投递，不为本项发送响应。
  bool one_way = 5;
}

// StreamCallResponse 逐项返回调用结果；错误只作用于本项。
message StreamCallResponse {
  uint64 id = 1;
  Result result = 2;
  int32 error_code = 3;
  string error_message = 4;
  reserved 5;
}

service DeliveryService {
  rpc Deliver(Delivery) returns (DeliveryAck);
  rpc Call(Delivery) returns (Result);
  // CallStream 在同一目标实例的长流上承载多项独立调用。
  rpc CallStream(stream StreamCallRequest) returns (stream StreamCallResponse);
}
