syntax = "proto3";

package tx.rpc.v1;

option go_package = "github.com/ngnl47/tx/modules/rpc/pb;rpcpb";

// RouteKind identifies how a delivery target is resolved.
enum RouteKind {
  ROUTE_KIND_UNSPECIFIED = 0;
  ROUTE_KIND_SERVICE = 1;
  ROUTE_KIND_INSTANCE = 2;
}

// Route contains transport-level routing metadata. Payload remains opaque.
message Route {
  RouteKind kind = 1;
  string service = 2;
  string instance_id = 3;
}

// Delivery is a directed internal message. Payload uses the caller's codec.
message Delivery {
  Route route = 1;
  string message_type = 2;
  uint64 command_id = 3;
  bytes payload = 4;
}

message DeliveryAck {
  bool accepted = 1;
  string error_code = 2;
}

service DeliveryService {
  rpc Deliver(Delivery) returns (DeliveryAck);
}
