syntax = "proto3";

package tx.rpc.v1;

option go_package = "github.com/ngnl47/tx/modules/rpc/pb;rpcpb";

// RouteKind 标识消息目标的解析方式。
enum RouteKind {
  ROUTE_KIND_UNSPECIFIED = 0;
  ROUTE_KIND_SERVICE = 1;
  ROUTE_KIND_INSTANCE = 2;
}

// Route 保存传输层路由元数据，Payload 保持不透明。
message Route {
  RouteKind kind = 1;
  string service = 2;
  string instance_id = 3;
}

// Delivery 表示一条定向内部消息，Payload 使用调用方选择的编解码格式。
message Delivery {
  Route route = 1;
  string message_type = 2;
  uint64 command_id = 3;
  bytes payload = 4;
}

message Result {
  string message_type = 1;
  uint64 command_id = 2;
  bytes payload = 3;
}

message DeliveryAck {
  bool accepted = 1;
  string error_code = 2;
}

service DeliveryService {
  rpc Deliver(Delivery) returns (DeliveryAck);
  rpc Call(Delivery) returns (Result);
}
