syntax = "proto3";

package tx.actor.v1;

option go_package = "github.com/ngnl47/tx/modules/actor/pb;actorpb";

enum RouteKeyKind {
  ROUTE_KEY_NONE = 0;
  ROUTE_KEY_INT64 = 1;
  ROUTE_KEY_UINT64 = 2;
  ROUTE_KEY_STRING = 3;
}

enum DeliveryMode {
  DELIVERY_MODE_TELL = 0;
  DELIVERY_MODE_ACCEPTED = 1;
  DELIVERY_MODE_CALL = 2;
}

enum AccessMode {
  ACCESS_MODE_NORMAL = 0;
  ACCESS_MODE_BORROW = 1;
}

// SessionIdentity 表示由 Agent 为当前连接构造的可信会话身份。
message SessionIdentity {
  int64 account_id = 1;
  int64 borrow_account_id = 2;
  int64 server_id = 3;
  int64 role_id = 4;
  int64 session_id = 5;
  int64 connection_id = 6;
  AccessMode access_mode = 7;
  bool can_create_role = 8;
}

// Delivery 是投递给 Actor 的内部消息，目标路由由 PID 承担。
// Payload 是调用方持有的不透明 BON 字节序列。
message Delivery {
  string message_type = 1;
  uint64 command_id = 2;
  bytes payload = 3;
  DeliveryMode mode = 4;
  RouteKeyKind route_key_kind = 5;
  fixed64 route_key_numeric = 6;
  string route_key_string = 7;
  uint64 request_id = 8;
  SessionIdentity identity = 9;
  int64 up_seq = 10;
}

// Acceptance 表示目标 Actor 已从邮箱取出确认式投递，但不代表业务处理已经完成。
message Acceptance {
  uint64 command_id = 1;
  uint64 request_id = 2;
}

// Result 是 Actor 完成业务处理后返回的不透明结果。
message Result {
  uint64 request_id = 1;
  string message_type = 2;
  uint64 command_id = 3;
  bytes payload = 4;
  int32 error_code = 5;
  string error_message = 6;
  // processed_up_seq 是 Agent 上行专用的处理完成序号，不能与业务结果字段同时出现。
  int64 processed_up_seq = 7;
}
