syntax = "proto3";

package tx.actor.v1;

option go_package = "github.com/ngnl47/tx/modules/actor/pb;actorpb";

enum RouteKeyKind {
  ROUTE_KEY_NONE = 0;
  ROUTE_KEY_INT64 = 1;
  ROUTE_KEY_UINT64 = 2;
  ROUTE_KEY_STRING = 3;
}

enum DeliveryMode {
  DELIVERY_MODE_TELL = 0;
  DELIVERY_MODE_ACCEPTED = 1;
  DELIVERY_MODE_CALL = 2;
}

enum DeliveryOrigin {
  DELIVERY_ORIGIN_INTERNAL = 0;
  DELIVERY_ORIGIN_CLIENT = 1;
  DELIVERY_ORIGIN_TASK = 2;
}

// SessionIdentity 只承载运行时身份和项目认证后的不透明字节。
message SessionIdentity {
  reserved 1, 2, 3, 7, 8;
  reserved "account_id", "borrow_account_id", "server_id", "access_mode", "can_create_role";
  int64 role_id = 4;
  int64 session_id = 5;
  int64 connection_id = 6;
  bytes claims = 9;
}

// Delivery 是投递给 Actor 的内部消息，目标路由由 PID 承担。
// Payload 是调用方持有的不透明 BON 字节序列。
message Delivery {
  string message_type = 1;
  fixed32 command_hash = 2;
  bytes payload = 3;
  DeliveryMode mode = 4;
  RouteKeyKind route_key_kind = 5;
  fixed64 route_key_numeric = 6;
  string route_key_string = 7;
  uint64 request_id = 8;
  SessionIdentity identity = 9;
  reserved 10;
  reserved "up_seq";
  DeliveryOrigin origin = 11;
}

// Acceptance 表示目标 Actor 已从邮箱取出确认式投递，但不代表业务处理已经完成。
message Acceptance {
  fixed32 command_hash = 1;
  uint64 request_id = 2;
}

// Result 是 Actor 完成业务处理后返回的不透明结果。
message Result {
  uint64 request_id = 1;
  string message_type = 2;
  fixed32 command_hash = 3;
  bytes payload = 4;
  int32 error_code = 5;
  string error_message = 6;
  reserved 7;
  reserved "processed_up_seq";
  // completed 表示业务处理成功完成且没有响应体，与业务结果字段互斥。
  bool completed = 8;
}

// DirectStreamCall 携带单项实体调用及本项剩余等待时间。
message DirectStreamCall {
  string type = 1;
  string id = 2;
  Delivery delivery = 3;
  int64 timeout_nano = 4;
}

// PlacementQuery 是进程级放置查询，不依赖目标 Actor 激活或邮箱。
service PlacementQuery {
  rpc ResolvePlacement(PlacementRequest) returns (PlacementResponse);
}
message PlacementRequest {
  string actor_type = 1;
  string actor_id = 2;
}
message PlacementResponse {
  string slot_id = 1;
}
