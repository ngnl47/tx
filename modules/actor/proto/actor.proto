syntax = "proto3";

package tx.actor.v1;

option go_package = "github.com/ngnl47/tx/modules/actor/pb;actorpb";

enum RouteKeyKind {
  ROUTE_KEY_NONE = 0;
  ROUTE_KEY_INT64 = 1;
  ROUTE_KEY_UINT64 = 2;
  ROUTE_KEY_STRING = 3;
}

enum DeliveryMode {
  DELIVERY_MODE_TELL = 0;
  DELIVERY_MODE_ACCEPTED = 1;
  DELIVERY_MODE_CALL = 2;
}

// Delivery 是投递给 Actor 的内部消息，目标路由由 PID 承担。
// Payload 是调用方持有的不透明 BON 字节序列。
message Delivery {
  string message_type = 1;
  uint64 command_id = 2;
  bytes payload = 3;
  DeliveryMode mode = 4;
  RouteKeyKind route_key_kind = 5;
  fixed64 route_key_numeric = 6;
  string route_key_string = 7;
  uint64 request_id = 8;
}

// Acceptance 表示目标 Actor 已从邮箱取出确认式投递，但不代表业务处理已经完成。
message Acceptance {
  uint64 command_id = 1;
  uint64 request_id = 2;
}

// Result 是 Actor 完成业务处理后返回的不透明结果。
message Result {
  uint64 request_id = 1;
  string message_type = 2;
  uint64 command_id = 3;
  bytes payload = 4;
  string error_code = 5;
  string error_message = 6;
}
