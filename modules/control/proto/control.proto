syntax = "proto3";

package tx.control.v1;

option go_package = "github.com/ngnl47/tx/modules/control/pb;controlpb";

enum LifecycleState {
  LIFECYCLE_STATE_UNSPECIFIED = 0;
  LIFECYCLE_STATE_RUNNING = 1;
  LIFECYCLE_STATE_DRAINING = 2;
  LIFECYCLE_STATE_DRAINED = 3;
  LIFECYCLE_STATE_FAILED = 4;
}

message Empty {}

message LifecycleStatus {
  LifecycleState state = 1;
  string error = 2;
}

message SlotAssignment {
  string slot_id = 1;
  string runtime_instance_id = 2;
  uint64 generation = 3;
}

message CreateSlotRequest {
  string slot_id = 1;
  string runtime_instance_id = 2;
}

message CreateSlotResponse {
  SlotAssignment assignment = 1;
}

message PromoteSlotRequest {
  SlotAssignment current = 1;
  string next_runtime_instance_id = 2;
}

message PromoteSlotResponse {
  SlotAssignment assignment = 1;
}

service LifecycleService {
  rpc Status(Empty) returns (LifecycleStatus);
  rpc Drain(Empty) returns (LifecycleStatus);
  rpc WaitDrained(Empty) returns (LifecycleStatus);
}

service SlotService {
  rpc CreateSlot(CreateSlotRequest) returns (CreateSlotResponse);
  rpc PromoteSlot(PromoteSlotRequest) returns (PromoteSlotResponse);
}
