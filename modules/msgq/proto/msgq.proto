syntax = "proto3";

package tx.msgq.v1;

option go_package = "github.com/ngnl47/tx/modules/msgq/pb;msgqpb";

// SessionHeader 标识一条具体的客户端连接。
message SessionHeader {
  int64 role_id = 1;
  int64 session_id = 2;
  int64 connection_id = 3;
}

message InitRequest {
  SessionHeader header = 1;
  bool restore = 2;
  int64 ack = 3;
}

message InitResponse {
  reserved 1;
  reserved "received_seq";
}

message PubSessionRequest {
  int64 session_id = 1;
  bytes payload = 2;
}

message PubSessionResponse {
  int64 seq = 1;
}

// PubRoleRequest 携带完整角色归属版本，只能投递到该归属的本地邮箱。
message PubRoleRequest {
  int64 role_id = 1;
  string instance_id = 2;
  string generation = 3;
  bytes payload = 4;
}

message FetchResponse {
  int64 seq = 1;
  bytes payload = 2;
}

message TopicRequest {
  SessionHeader header = 1;
  repeated string topics = 2;
}

message TopicsResponse {
  repeated string topics = 1;
}

message BroadcastTopicRequest {
  string topic = 1;
  bytes payload = 2;
}

message BroadcastResponse {
  int32 attempted = 1;
  int32 delivered = 2;
  int32 skipped = 3;
  int32 overflowed = 4;
}

message TerminateSessionRequest {
  SessionHeader header = 1;
}

message MailboxStreamRequest {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_OPEN = 1;
    KIND_CLOSE = 2;
    KIND_ACK = 3;
    KIND_RENEW = 4;
  }
  SessionHeader header = 1;
  Kind kind = 2;
  int64 ack = 3;
  int32 max = 4;
  reserved 5;
  reserved "received_seq";
}

message MailboxStreamResponse {
  SessionHeader header = 1;
  FetchResponse message = 2;
  string error_message = 3;
}

message PublishRequest {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_SESSION = 1;
    KIND_ROLE = 2;
  }
  Kind kind = 1;
  int64 session_id = 2;
  int64 role_id = 3;
  string instance_id = 4;
  string generation = 5;
  bytes payload = 6;
}

// PublishRoleRejection 回带明确未入邮箱的旧归属载荷，不确认成功发布。
message PublishRoleRejection {
  int64 role_id = 1;
  string instance_id = 2;
  string generation = 3;
  bytes payload = 4;
}

message Empty {}

// MailboxService 是 msgq 专用传输服务，Payload 字节保持为 BON 数据。
service MailboxService {
  rpc Init(InitRequest) returns (InitResponse);
  rpc PubSession(PubSessionRequest) returns (PubSessionResponse);
  rpc PubRole(PubRoleRequest) returns (BroadcastResponse);
  rpc MailboxStream(stream MailboxStreamRequest) returns (stream MailboxStreamResponse);
  rpc PublishStream(stream PublishRequest) returns (stream PublishRoleRejection);
  rpc JoinTopics(TopicRequest) returns (Empty);
  rpc LeaveTopics(TopicRequest) returns (Empty);
  rpc Topics(TopicRequest) returns (TopicsResponse);
  rpc BroadcastTopic(BroadcastTopicRequest) returns (BroadcastResponse);
  rpc TerminateSession(TerminateSessionRequest) returns (Empty);
}
