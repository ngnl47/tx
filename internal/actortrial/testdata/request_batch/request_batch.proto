syntax = "proto3";
package actortrial;
option go_package = "github.com/ngnl47/tx/internal/actortrial";

// 实验封包保留原身份、业务载荷和独立回复地址，不占用业务 RequestId。
message ComparisonRequestBatch {
  repeated ComparisonRequestEntry entries = 1;
}
message ComparisonRequestEntry {
  string identity = 1;
  bytes delivery = 2;
  string reply = 3;
}
